[build]
  publish = "."
  command = ""

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML: short cache — pages may update frequently
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# CSS and JS: short cache + revalidate so updates go live immediately
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

# Local images: 30-day cache
[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

